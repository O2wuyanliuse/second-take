name: ci

# 跑七件：ruff → 启动自检 → 门禁 → 链接 → 脱敏 → 维护方法双写 → 用例。
# 不装项目依赖；只装 ruff 与 pytest 两个工具。用例在 `tests/`，测的是**本库自己的检查器**，
# 不读任何项目文件——所以它能在干净机器上跑，也不会因为某个项目改名而红。
# 目的不是「证明代码完美」，是**别人 clone 下来之前，先有人替他跑一遍**.

on:
  push:
  pull_request:
  # 手动触发：新库刚开 Actions、或想重跑一次时用，不必推空提交。
  # 没有这一行，「动作」页右边不会出现「运行工作流」按钮。
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 双写检查要 diff「相对 master 改了哪些文件」，浅克隆拿不到基准
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 装 ruff 与 pytest
        run: python -m pip install --quiet ruff pytest
      - name: ① ruff（只开真错：F + E9）
        run: python -m ruff check .
      # CI 就是一台干净机器——正好让它自证「clone 下来能不能自己长出来」。
      # 先幂等 init（缺目录就建），再 check（退出 0 才算合格）。
      - name: ② 启动自检（干净机器：先建再验）
        run: python tools/bootstrap.py && python tools/bootstrap.py --check
      # 本库退出码约定：0 绿 ／ 1 阻断 ／ **2 提示**。GitHub Actions 只认 0，
      # 直接 `run: python gate/_gate.py` 会把「提示档」判成失败——17 次运行全红就是它。
      # 与 `.githooks/pre-commit` 的 run() 同一条口径。
      - name: ③ 门禁（骨架库只覆盖 3/19，跳过不算绿）
        shell: bash
        run: |
          set +e
          python gate/_gate.py
          rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "::error::门禁返回 $rc（1＝阻断），不是提示档"
            exit "$rc"
          fi
          echo "门禁退出码 $rc（2＝提示档，不是红）"
      - name: ④ 断链（文档里写的路径真的存在）
        run: python gate/_links.py
      # ⑤ 词表**不在仓库里**（它必须写出要禁的词，留在库里等于自泄一次）。
      #    CI 从仓库 secret 注入到 .ci/（已 gitignore）；secret 空＝这一项没查成，判红。
      - name: ⑤ 脱敏（词表从 secret 注入，只看当前树）
        shell: bash
        run: |
          mkdir -p .ci
          printf "%s" "${{ secrets.PUBLIC_DENYLIST }}" > .ci/denylist.txt
          if [ ! -s .ci/denylist.txt ]; then
            echo "::error::secret PUBLIC_DENYLIST 为空——脱敏这一项没查成，不算通过"
            exit 1
          fi
          python packaging/_leakscan.py --words .ci/denylist.txt --no-history
      # ⑥ 比较基准必须是「推送前那个提交」，不能用 origin/master：
      # push 到 master 时 origin/master 就是刚推的 HEAD，diff 恒为空——那是个永远绿的假检查。
      - name: ⑥ 维护方法双写
        shell: bash
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "首次推送，没有可比基准——本步不判。"
            exit 0
          fi
          python tools/check_maintenance.py --base "$BASE"
      # ⑦ 用例测的是「检查器还有没有牙」：无词表给不给绿、断链报不报、双写会不会被
      #    下一条提交的免责标签顶掉。改判据的人先在这里红，别等发布那天红。
      - name: ⑦ 用例（32 条，测本库的检查器）
        run: python -m pytest -q
