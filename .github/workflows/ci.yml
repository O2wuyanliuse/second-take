name: ci

# 跑七件：ruff → 启动自检 → 门禁 → 链接 → 脱敏 → 维护方法双写 → 用例。
# 不装项目依赖；只装 ruff 与 pytest 两个工具。用例在 `tests/`，测的是**本库自己的检查器**，
# 不读任何项目文件——所以它能在干净机器上跑，也不会因为某个项目改名而红。
# 目的不是「证明代码完美」，是**别人 clone 下来之前，先有人替他跑一遍**.

on:
  push:
  pull_request:
  # 手动触发：新库刚开 Actions、或想重跑一次时用，不必推空提交。
  # 没有这一行，「动作」页右边不会出现「运行工作流」按钮。
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 双写检查要 diff「相对 master 改了哪些文件」，浅克隆拿不到基准
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 装 ruff 与 pytest
        run: python -m pip install --quiet ruff pytest
      # 仓库改名/搬家后 latest.json 里的地址最容易悄悄指向旧家（302 能通，所以没人发现）。
      - name: ⓪ latest.json 的地址要对上当前仓库
        shell: bash
        run: |
          # 不用非贪婪量词（[^/]+?）：GNU sed 的 ERE 不认，会直接报错退出，slug 变成空串。
          url=$(git remote get-url origin)
          slug=$(echo "$url" | sed -E 's#.*github\.com[:/]([^/]+)/([^/]+)$#\1/\2#; s#\.git$##')
          if [ -z "$slug" ]; then
            echo "::error::推断不出 owner/repo：$url"
            exit 1
          fi
          echo "slug=$slug"
          grep -q "github.com/$slug/" latest.json || { echo "::error::latest.json 指向的不是 $slug"; exit 1; }
      - name: ① ruff（只开真错：F + E9）
        run: python -m ruff check .
      # CI 就是一台干净机器——正好让它自证「clone 下来能不能自己长出来」。
      # 先幂等 init（缺目录就建），再 check（退出 0 才算合格）。
      - name: ② 启动自检（干净机器：先建再验）
        run: python tools/bootstrap.py && python tools/bootstrap.py --check
      # 本库退出码约定：0 绿 ／ 1 阻断 ／ **2 提示**。GitHub Actions 只认 0，
      # 直接 `run: python gate/_gate.py` 会把「提示档」判成失败——17 次运行全红就是它。
      # 与 `.githooks/pre-commit` 的 run() 同一条口径。
      - name: ③ 门禁（骨架库只覆盖 3/19，跳过不算绿）
        shell: bash
        run: |
          set +e
          python gate/_gate.py
          rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "::error::门禁返回 $rc（1＝阻断），不是提示档"
            exit "$rc"
          fi
          echo "门禁退出码 $rc（2＝提示档，不是红）"
      - name: ④ 断链（文档里写的路径真的存在）
        run: python gate/_links.py
      # ⑤ 词表**不在仓库里**（它必须写出要禁的词，留在库里等于自泄一次）。
      #    CI 从仓库 secret 注入到 .ci/（已 gitignore）；secret 空＝这一项没查成，判红。
      #    **fork 来的 PR 例外**：它拿不到本仓 secret，这一项必然「没查成」。
      #    让它红，等于「所有外部 PR 都合不进来」——关掉的是门，不是漏洞；伤的是
      #    「宣称开源、但谁提 PR 都红」。所以跳过，并在 summary 里明说没查（跳过≠通过）。
      #    条件写成「非 PR 或同仓 PR」而不是「push 或同仓 PR」：workflow_dispatch
      #    手动触发也要照常跑，别让它被漏在门外。
      - name: ⑤ 说明（fork PR 拿不到 secret，这一项会跳过）
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "⑤ 脱敏：**这一项没查**——fork 来的 PR 拿不到本仓 secret。" >> "$GITHUB_STEP_SUMMARY"
          echo "这不是通过，是权限边界；词表本身不在仓库里，fork 侧也没有。" >> "$GITHUB_STEP_SUMMARY"
      - name: ⑤ 脱敏（词表从 secret 注入，只看当前树）
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          mkdir -p .ci
          printf "%s" "${{ secrets.PUBLIC_DENYLIST }}" > .ci/denylist.txt
          if [ ! -s .ci/denylist.txt ]; then
            echo "::error::secret PUBLIC_DENYLIST 为空——脱敏这一项没查成，不算通过"
            exit 1
          fi
          python packaging/_leakscan.py --words .ci/denylist.txt --no-history
      # ⑥ 比较基准必须是「推送前那个提交」，不能用 origin/master：
      # push 到 master 时 origin/master 就是刚推的 HEAD，diff 恒为空——那是个永远绿的假检查。
      - name: ⑥ 维护方法双写
        shell: bash
        run: |
          # tag 推送不产生「改了代码却没改维护方法」这回事：此时 github.event.before 是
          # **上一个 tag 对象**（不是提交），按提交段比较必然判错——那是假红，跳过并说明。
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag 推送：跳过双写检查（没有提交段可比）"
            exit 0
          fi
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "首次推送，没有可比基准——本步不判。"
            exit 0
          fi
          python tools/check_maintenance.py --base "$BASE"
      # 文档说要、机器不查，等于没说：对外文档必须带英文摘要（只查有没有，质量归 review）。
      - name: ⑥b 双语（对外文档有没有英文摘要）
        run: python tools/check_bilingual.py
      # ⑦ 用例测的是「检查器还有没有牙」：无词表给不给绿、断链报不报、双写会不会被
      #    下一条提交的免责标签顶掉。改判据的人先在这里红，别等发布那天红。
      - name: ⑦ 用例（32 条，测本库的检查器）
        run: python -m pytest -q
